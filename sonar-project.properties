sonar.projectKey=ghazy001_EcoEvent
sonar.organization=ghazy001
sonar.projectName=EcoEvent

# Folders to scan
sonar.sources=app,bootstrap,config,database,resources,routes
sonar.exclusions=**/vendor/**,storage/**,public/**,node_modules/**

# Test setup
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# PHP coverage (generated by PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
